name: CI

on:
  push:
    branches: [master]
  pull_request:

# The merged workspace: base/ (one published package), mem/ / mission/ / identity/ (one published plugin each).
#
# What runs here: `pnpm install` → build → typecheck → test → guard → version:check, plus the
# publish-surface check, and — in its own job, `mount-smoke` — `pnpm build:dsh` for EVERY plugin tree,
# which builds the base and then mounts the plugin in a real Cordis context. That moves the family's
# core promise ("it really mounts") out of the by-hand layer and into the enforced one.
#
# The RELEASE gates (`pnpm release:check:<pkg>` with its old-dsh leg and registry probe,
# `pnpm pack:plugin:*`, `pnpm proof:base-swap:mount`) additionally need a profile and network, so they
# stay LOCAL — run them by hand before releasing; see AGENTS.md §"After changing ANY shared code under
# base/**". They are deliberately NOT in `mount-smoke`: the review asked for `build:dsh`, not for the
# whole release gate.
#
# An installed dsh IS needed, though, and this workflow used to claim otherwise while calling scripts
# that hard-require it: base's `typecheck`/`test` run `link-dsh.mjs`, which exits 1 without one, and 3
# of base's 29 specs mount the host's REAL registries on purpose (that is what proves the compat
# probes mission against a real host rather than a stub). Installing it keeps those tests running —
# skipping them would quietly turn "354 tests are covered" into "the ones that fit are".
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the DSH harness (base's probe specs mount its real registries)
        run: npm i -g @deepseek-ai/dsh
      - name: Build (all workspace packages)
        run: pnpm -r build
      # AFTER the build, not before: mem's `typecheck` reads its dependencies through their emitted
      # `lib/*.d.ts`, and the plugin typechecks resolve `@avantf/dsh-plugin-base` through `base/`'s
      # built `dist/*.d.ts`. The test tsconfigs (`tsconfig.test.json`) are the reason this is a gate
      # at all — `build` only covers `src`, so without this step a spec can reference a type that does
      # not exist and pass.
      - name: Typecheck (src + tests, all packages)
        run: pnpm -r typecheck
      - name: Test (all packages)
        run: pnpm -r test
      # P-02's deterministic arm: the derived-query regression net. Stub mode needs no model and no
      # network, and it is the arm that proves the FIXTURE (a planted carrier outranks the gold;
      # removing it restores the gold) rather than the product. The real-model arm is reporting-only
      # and runs nightly — see `.github/workflows/derived-eval-real.yml`. Needs the build above,
      # because the runner imports the emitted `lib/`.
      - name: Derived-query regression net (deterministic stub)
        run: node mem/packages/core/scripts/derived_eval.mjs --mode stub
      # The root gates' own logic, replayed on constructed input: group-scoped version
      # materialization (M7), the base peer↔devDependencies pair, per-tree dsh-line coverage (M8)
      # and the plugin prepublishOnly wiring (M10). No build, no registry — the dsh-line half uses
      # the workspace's resolved semver (installed above with the frozen lockfile).
      - name: Gate logic self-tests
        run: node scripts/gates.test.mjs
      # The four other self-test files the earlier waves added; without a step here a fixed gate
      # exists only on the machine that ran it by hand.
      - name: Toolchain self-tests (check-old-dsh cache key, preset drift, boundary guard)
        run: node scripts/toolchain.test.mjs
      - name: dsh-line coverage self-tests
        run: node scripts/check-dsh-lines.test.mjs
      - name: Mission build self-tests (win32 launcher shape)
        run: node mission/scripts/build.test.mjs
      # The base's version is also baked into `src/bootstrap.ts`; this pins the writer and the check
      # that keep the two copies together.
      - name: Version tool self-tests (manifest ↔ baked bootstrap constant)
        run: node scripts/version.test.mjs
      - name: Boundary guard (no plugin tree imports another)
        run: pnpm guard
      # Each group records its version in exactly ONE carrier manifest; this catches a second copy
      # or a bump that missed the carrier.
      - name: Versions (one carrier manifest per group)
        run: pnpm version:check
      # Static publish-surface checks only: `--offline` skips the registry probe that proves the base
      # is already published (that probe belongs to a release machine).
      - name: Release surface (publishable set, peer ranges, one zod, no link:/file:)
        run: pnpm release:check --offline
      # The base-swap proof is static here (built artifacts + a swapped base module); `--mount` needs
      # the installed harness and stays local.
      - name: Base-swap proof (no plugin rebuild required)
        run: pnpm proof:base-swap

  # A separate job on purpose: `build-test` proves the source COMPILES and passes its tests, this one
  # proves the built artifact actually MOUNTS. `pnpm build:dsh <tree>` builds the base first, then runs
  # that tree's mount smoke against the installed dsh's real Cordis context — the host service, the
  # model tools / prompt section and the Typert Remote must all register. Nothing else
  # is repeated here (no `pnpm -r build`, no typecheck, no test): the two builds ARE the point, and
  # the pnpm store is shared with `build-test` through `cache: pnpm`.
  #
  # The dominant failure source is HARNESS DRIFT — a fresh dsh whose host API moved. So the harness
  # version is printed before anything is built, and each mount's output is teed to a file and then
  # asserted for `MOUNT SMOKE OK`. A log that instead ends in `compat: INCOMPATIBLE … REFUSING to
  # load` or `the installed dsh peers were not found` is a version/install failure, not a mount bug.
  mount-smoke:
    runs-on: ubuntu-latest
    # Three full plugin builds (each rebuilds the base) plus three real Cordis mounts: several times
    # the observed end-to-end runtime, so this bounds a hung mount rather than normal work.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          # No matrix: there is one supported line, and the mount proves the artifact, not the Node
          # version — `build-test` is where another Node would go.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the DSH harness (the peers a live profile loads)
        run: npm i -g @deepseek-ai/dsh
      # Printed BEFORE any build: with the version in the log, a red run is triaged without a rerun,
      # and "our mount broke" is distinguishable from "dsh moved under us".
      - name: Harness version (drift triage)
        run: |
          which dsh
          dsh --version
          npm root -g
          npm ls -g --depth=0 @deepseek-ai/dsh
      # `tee` keeps the full mount smoke output in the step log (that is what a failure has to be read
      # from), while the `grep` is the explicit assertion that the smoke actually reached its OK line —
      # an exit code alone would also be 0 if a future build flags the smoke away.
      - name: Mount smoke — mem (@avantf/dsh-mem)
        run: |
          set -o pipefail
          pnpm build:dsh mem 2>&1 | tee mount-mem.log
          grep -q 'MOUNT SMOKE OK' mount-mem.log
      - name: Mount smoke — mission (@avantf/dsh-mission)
        run: |
          set -o pipefail
          pnpm build:dsh mission 2>&1 | tee mount-mission.log
          grep -q 'MOUNT SMOKE OK' mount-mission.log
      - name: Mount smoke — identity (@avantf/dsh-identity)
        run: |
          set -o pipefail
          pnpm build:dsh identity 2>&1 | tee mount-identity.log
          grep -q 'MOUNT SMOKE OK' mount-identity.log
